server {
    listen 80;
    listen [::]:80;
    server_name anjing.kuto.club;

    root /srv/anjing-vision/frontend;
    index index.html;
    client_max_body_size 1600m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /console-static/index.html =404;
    }

    location = /console {
        return 302 /;
    }

    location = /console/ {
        return 302 /;
    }

    location /console-static/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /preview-static/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~ ^/(api|static|preview)/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_offline;
    }

    location @backend_offline {
        default_type application/json;
        return 502 '{"error":{"code":"backend_offline","message":"演示后端当前未启动，请稍后重试"}}';
    }
}
