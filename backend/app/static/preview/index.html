<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 房间预览 - 安龄智境</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10141b; color: #e8eaf0;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  #pcanvas-wrap { position: absolute; inset: 0; display: block; }
  #canvas { position: absolute; inset: 0; }
  #gcontainer { position: absolute; inset: 0; display: none; }
  #gcontainer canvas { width: 100%; height: 100%; display: block; }
  #hud { position: absolute; top: 12px; left: 12px; z-index: 10; pointer-events: none; }
  #hud h1 { font-size: 16px; font-weight: 600; margin: 0 0 2px; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  #hud .sub { font-size: 12px; opacity: .75; }
  #panel { position: absolute; top: 12px; right: 12px; z-index: 10; width: 250px;
    background: rgba(16,20,27,.88); backdrop-filter: blur(8px); border: 1px solid #2a3140;
    border-radius: 10px; padding: 12px; font-size: 13px; }
  #panel h2 { font-size: 13px; margin: 0 0 8px; opacity: .9; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row label { flex: 1; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .swatch { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .row input[type=checkbox] { accent-color: #4f9cf9; }
  .row input[type=range] { flex: 1; }
  .btn { width: 100%; margin-top: 4px; padding: 6px 10px; border-radius: 6px; border: 1px solid #34405a;
    background: #1d2532; color: #e8eaf0; cursor: pointer; font-size: 12.5px; }
  .btn:hover { background: #263143; }
  #stats { font-size: 11.5px; opacity: .65; margin-top: 8px; line-height: 1.5; word-break: break-all; }
  #overlay { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: rgba(16,20,27,.92); }
  #overlay .title { font-size: 17px; margin-bottom: 14px; }
  #bar-outer { width: 320px; height: 8px; border-radius: 6px; background: #232b3a; overflow: hidden; }
  #bar { height: 100%; width: 0%; background: linear-gradient(90deg,#4f9cf9,#7dd3fc); transition: width .15s; }
  #overlay .status { margin-top: 10px; font-size: 12.5px; opacity: .8; }
  #error { color: #ff8fa3; font-size: 13px; max-width: 520px; text-align: center; display: none; }
  #btn-retry { display: none; width: auto; margin-top: 14px; padding: 7px 18px; }
  .hint { position: absolute; bottom: 10px; left: 12px; z-index: 10; font-size: 11.5px; opacity: .55; pointer-events: none; }
</style>
</head>
<body>
<div id="pcanvas-wrap"><div id="canvas"></div></div>
<div id="gcontainer"></div>
<div id="hud">
  <h1 id="scene-title">3D 房间预览</h1>
  <div class="sub" id="scene-sub">加载中…</div>
</div>
<div id="panel">
  <h2>显示图层</h2>
  <div class="row" id="row-pcd"><label><input type="checkbox" id="ck-pcd" checked> <span class="swatch" style="background:#aab4c8"></span> 稠密点云</label></div>
  <div class="row" id="row-walls"><label><input type="checkbox" id="ck-walls" checked> <span class="swatch" style="background:#4f9cf9"></span> 墙</label></div>
  <div class="row" id="row-doors"><label><input type="checkbox" id="ck-doors" checked> <span class="swatch" style="background:#ffb703"></span> 门</label></div>
  <div class="row" id="row-windows"><label><input type="checkbox" id="ck-windows" checked> <span class="swatch" style="background:#5ce98a"></span> 窗</label></div>
  <div class="row" id="row-objects"><label><input type="checkbox" id="ck-objects" checked> <span class="swatch" style="background:#ff8fa3"></span> 家具</label></div>
  <div class="row" id="row-obstacles"><label><input type="checkbox" id="ck-obstacles" checked> <span class="swatch" style="background:#ff7a00"></span> 未知障碍</label></div>
  <div class="row" id="row-labels"><label><input type="checkbox" id="ck-labels" checked> 名称与尺寸</label></div>
  <div class="row" id="row-point-size"><span>点大小</span><input type="range" id="point-size" min="0.5" max="6" step="0.5" value="1.5"></div>
  <div class="row" id="row-rotate"><label><input type="checkbox" id="ck-rotate"> 自动旋转</label></div>
  <button class="btn" id="btn-mode-points">真实场景（稠密点云）</button>
  <button class="btn" id="btn-mode-structure">空间结构（无 Gaussian）</button>
  <button class="btn" id="btn-reset">重置视角</button>
  <button class="btn" id="btn-shot">保存截图</button>
  <div id="stats"></div>
</div>
<div class="hint">左键旋转 · 滚轮缩放 · 右键平移</div>
<div id="overlay">
  <div class="title">正在加载 3D 场景…</div>
  <div id="bar-outer"><div id="bar"></div></div>
  <div class="status" id="overlay-status">初始化</div>
  <div id="error"></div>
  <button class="btn" id="btn-retry" type="button">重新加载 3D 场景</button>
</div>
<script type="importmap">
{"imports": {"three": "/preview-static/three.module.js"}}
</script>
<script src="/preview-static/three.min.js"></script>
<script src="/preview-static/OrbitControls.js"></script>
<script src="/preview-static/structure_main.js?v=20260820-video-layout-v3"></script>
<script src="/preview-static/gaussian_main.js?v=20260820-formal-modes"></script>
<script src="/preview-static/viewer.js?v=20260821-restored-tsdf-fine-points"></script>
</body>
</html>
